<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Three rising bars in indigo, matching the header mark. One saturated mid
       tone rather than a light/dark pair: a favicon sits on browser chrome this
       page does not pick, and indigo reads on both. -->
  <g fill="#6366f1">
    <rect x="2" y="9" width="3" height="5" rx="1"/>
    <rect x="6.5" y="5" width="3" height="9" rx="1"/>
    <rect x="11" y="2" width="3" height="12" rx="1"/>
  </g>
</svg>
